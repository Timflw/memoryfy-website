<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https://memoryfy.goatcounter.com; connect-src https://memoryfy.goatcounter.com; base-uri 'none'; frame-ancestors 'none'; form-action 'none';">
  <title>Memoryfy laden</title>
  <link rel="icon" href="/assets/memoryfy_favicon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f0f1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1a1a2e;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { height: 40px; width: auto; margin-bottom: 24px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #a0a0b8; font-size: 15px; line-height: 1.6; }
    .spinner {
      border: 3px solid #1a1a2e;
      border-top: 3px solid #4a9eff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }

    .stores { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .store-button {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1.15rem;
      border-radius: 12px;
      text-decoration: none;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.98);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .store-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.32);
    }
    .store-button:focus-visible {
      outline: 3px solid rgba(165, 180, 252, 0.65);
      outline-offset: 3px;
    }
    .store-button__icon-wrap {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .store-button__icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.25));
    }
    .store-button__text {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.1rem;
      text-align: left;
      min-width: 0;
    }
    .store-button__meta {
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.1;
    }
    .store-button__brand {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .note { margin-top: 20px; font-size: 13px; color: #7a7a94; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/logo.png" alt="Memoryfy" class="logo">

    <!-- Redirect state: only ever shown on iOS/Android, where the JS below
         navigates away immediately. Stays hidden if the redirect never fires. -->
    <div id="redirecting" class="hidden">
      <div class="spinner"></div>
      <p>Du wirst zum <span id="redirect-target">Store</span> weitergeleitet&hellip;</p>
    </div>

    <div id="picker">
      <h1>Memoryfy laden</h1>
      <p>Gemeinsames Filmen ohne Schnitt. W&auml;hle deinen Store:</p>
    </div>

    <div class="stores">
      <a class="store-button" href="https://apps.apple.com/de/app/memoryfy-gemeinsames-filmen/id6759965346"
         title="Im App Store &ouml;ffnen">
        <span class="store-button__icon-wrap" aria-hidden="true">
          <img class="store-button__icon" src="/assets/Applelogo%20200x200.png" alt="">
        </span>
        <span class="store-button__text">
          <span class="store-button__meta">Download on the</span>
          <span class="store-button__brand">App Store</span>
        </span>
      </a>
      <a class="store-button" href="https://play.google.com/store/apps/details?id=de.cts.memoryfy"
         title="Bei Google Play &ouml;ffnen">
        <span class="store-button__icon-wrap" aria-hidden="true">
          <img class="store-button__icon" src="/assets/Playstore%20200x200.png" alt="">
        </span>
        <span class="store-button__text">
          <span class="store-button__meta">Get it on</span>
          <span class="store-button__brand">Google Play</span>
        </span>
      </a>
    </div>

    <p id="desktop-note" class="note hidden">
      Memoryfy ist eine mobile App. Scanne die Seite mit deinem Smartphone
      oder w&auml;hle den passenden Store.
    </p>
  </div>

  <noscript>
    <img src="https://memoryfy.goatcounter.com/count?p=/download-noscript" alt=""
         style="position:absolute;left:-9999px">
  </noscript>

  <script>
    (function () {
      var IOS_URL = 'https://apps.apple.com/de/app/memoryfy-gemeinsames-filmen/id6759965346';
      var PLAY_URL = 'https://play.google.com/store/apps/details?id=de.cts.memoryfy';

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      // iPadOS >=13 reports a desktop (Macintosh) UA - detect it via touch
      // support so iPads still get the App Store.
      var isIos = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      var platform = isAndroid ? 'android' : (isIos ? 'ios' : 'desktop');

      var url = 'https://memoryfy.goatcounter.com/count?p=' +
        encodeURIComponent('/download-' + platform) + '&rnd=' + Math.random();
      try {
        fetch(url, { method: 'GET', mode: 'no-cors', keepalive: true, credentials: 'omit' });
      } catch (e) {
        new Image().src = url;
      }

      if (platform === 'desktop') {
        document.getElementById('desktop-note').classList.remove('hidden');
        return;
      }

      // Mobile: swap in the redirect state, then leave. The store buttons stay
      // in the DOM as a fallback if the navigation is blocked or slow.
      document.getElementById('picker').classList.add('hidden');
      document.getElementById('redirect-target').textContent =
        platform === 'ios' ? 'App Store' : 'Google Play';
      document.getElementById('redirecting').classList.remove('hidden');

      // replace() keeps this page out of the history stack, so Back returns to
      // wherever the user came from instead of re-triggering the redirect.
      window.location.replace(platform === 'ios' ? IOS_URL : PLAY_URL);
    })();
  </script>
</body>
</html>
