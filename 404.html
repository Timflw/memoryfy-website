<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Memoryfy – Seite nicht gefunden</title>
  <link rel="icon" href="/assets/memoryfy_favicon.png" type="image/png">
  <!-- GitHub Pages serves this file for every unknown path. Invite links use
       the canonical form https://memoryfy.app/i/TOKEN (required by Android
       App Links / iOS Universal Links), which has no static file — this
       handler forwards them to the landing page at /i/?t=TOKEN. -->
  <script>
    (function () {
      var match = window.location.pathname.match(/^\/i\/([^\/]+)\/?$/);
      if (match) {
        window.location.replace('/i/?t=' + encodeURIComponent(match[1]));
      }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f0f1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1a1a2e;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { height: 40px; width: auto; margin-bottom: 24px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #a0a0b8; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
    a { color: #4a9eff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/logo.png" alt="Memoryfy" class="logo">
    <h1>Seite nicht gefunden</h1>
    <p>Die aufgerufene Seite existiert nicht (mehr).</p>
    <a href="/">Zur Startseite</a>
  </div>
</body>
</html>
